<!DOCTYPE html>
<html lang="en" data-theme="mocha">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoehnX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/catppuccin-mocha.min.css"
    id="hljs-theme">
</head>

<body>
  <header id="header">
    <button id="menu-toggle" class="header-btn" aria-label="Toggle menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div id="header-title"><a href="#">FoehnX</a></div>
    <div id="header-right">
      <button id="toc-toggle" class="header-btn" aria-label="Toggle table of contents">
        <i class="fa-solid fa-list"></i>
      </button>
      <button id="theme-toggle" class="header-btn" aria-label="Toggle theme">
        <i id="icon-moon" class="fa-solid fa-moon"></i>
        <i id="icon-sun" class="fa-solid fa-sun" style="display:none"></i>
      </button>
    </div>
  </header>

  <div id="overlay" class="overlay"></div>

  <nav id="sidebar" class="sidebar">
    <div class="sidebar-header">Menu</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#notes/markdown_test.md">Markdown Test</a></li>
    </ul>
  </nav>

  <main id="content">
    <article id="article"></article>
  </main>

  <aside id="toc" class="toc">
    <div class="sidebar-header">Contents</div>
    <ul id="toc-list"></ul>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.7/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-emoji/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="render.js"></script>
</body>

</html>
